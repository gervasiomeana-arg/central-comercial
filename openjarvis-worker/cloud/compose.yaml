name: central-openjarvis

services:
  ollama:
    image: ollama/ollama:0.30.10@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_NUM_PARALLEL: '1'
    volumes:
      - model-data:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  model:
    image: ollama/ollama:0.30.10@sha256:bfc9c6d53cc6989aa5131a6fde6b162b2802d4d337657f3253b5f69579bddeee
    network_mode: service:ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
    command: [pull, '${OPENJARVIS_MODEL:-qwen3.5:2b}']
    restart: 'no'

  jarvis:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
      target: jarvis
    network_mode: service:ollama
    depends_on:
      model:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://127.0.0.1:11434
    command: [serve, --host, 127.0.0.1, --port, '8000', --engine, ollama, --model, '${OPENJARVIS_MODEL:-qwen3.5:2b}']
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).close()']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  bridge:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
      target: bridge
    network_mode: service:ollama
    depends_on:
      jarvis:
        condition: service_healthy
    environment:
      CENTRAL_URL: '${CENTRAL_URL:-https://central-comercial.ai.studio/}'
      OPENJARVIS_WORKER_KEY: '${OPENJARVIS_WORKER_KEY:?Configurá la clave del puente en el servidor}'
      OPENJARVIS_STATE_DIR: /var/lib/central-openjarvis
      OPENJARVIS_URL: http://127.0.0.1:8000
      OPENJARVIS_MODEL: '${OPENJARVIS_MODEL:-qwen3.5:2b}'
    volumes:
      - bridge-state:/var/lib/central-openjarvis
    restart: unless-stopped

volumes:
  model-data:
  bridge-state:
